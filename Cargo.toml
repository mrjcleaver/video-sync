[package]
name = "video-sync"
version = "0.1.0"
edition = "2021"
description = "Unified Video Indexing & Publishing Bridge - Catalog domain"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "video-sync"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde", "js"] }
chrono = { version = "0.4", features = ["serde"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
thiserror = "2"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
