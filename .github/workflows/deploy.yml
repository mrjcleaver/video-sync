name: Build & Deploy to Cloud Run

on:
  push:
    branches: [main, claude/video-bridge-adr-ddd-dlFIk]
  workflow_dispatch:

env:
  PROJECT_ID: agentics-487016
  REGION: us-central1
  SERVICE: video-sync
  IMAGE: us-central1-docker.pkg.dev/agentics-487016/video-sync/app

jobs:
  build-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: |
          docker build \
            --tag ${{ env.IMAGE }}:${{ github.sha }} \
            --tag ${{ env.IMAGE }}:latest \
            --cache-from ${{ env.IMAGE }}:latest \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --build-arg BUILD_SHA=${{ github.sha }} \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            .
        env:
          DOCKER_BUILDKIT: 1

      - name: Push image
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          flags: >-
            --concurrency=80
            --timeout=3600
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=3
            --allow-unauthenticated
            --no-cpu-throttling
          env_vars: NODE_ENV=production
          secrets: OPENROUTER_API_KEY=OPENROUTER_API_KEY:latest

      - name: Print service URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
